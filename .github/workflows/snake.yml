name: profile-graphics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Jinsssss333
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff
      - uses: yoshi389111/github-profile-3d-contrib@0.9.1
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: Jinsssss333}
      - run: mkdir -p dist && cp -r profile-3d-contrib dist/
      - uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: output, build_dir: dist}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
